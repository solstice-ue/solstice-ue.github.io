<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solstice</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- Flare：首帧前套用主题类，避免主题闪烁。data-default-* 必须与 Program.cs 里注册的一致。 -->
    <script src="_content/Flare.Components/js/flare-bootstrap.js"
            data-default-theme="md3"
            data-default-palette="md3-violet"
            data-default-mode="auto"></script>
    <link rel="stylesheet" href="_content/Flare.Components/css/flare-components.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>

    <style>
        html { background: #fffbfe; }
        html.flare-mode-dark { background: #141218; }

        body {
            margin: 0;
            font-family: Roboto, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        /* ---------- 启动画面 ---------- */
        #flare-splash {
            position: fixed; inset: 0; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            background: #fffbfe; color: #1d1b20;
            font-size: 15px; letter-spacing: .18em;
        }
        html.flare-mode-dark #flare-splash { background: #141218; color: #e6e1e5; }

        /* ---------- 顶栏 ---------- */
        .solstice-bar {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 0 8px;
        }
        .solstice-brand {
            font-size: 18px; font-weight: 600;
            color: var(--flare-color-on-surface);
        }
        .solstice-sub {
            font-size: 12px;
            color: var(--flare-color-on-surface-variant);
        }
        .solstice-spacer { flex: 1; }
        .solstice-hint {
            font-size: 12px;
            color: var(--flare-color-on-surface-variant);
        }

        /* ---------- 侧边栏 ---------- */
        .solstice-nav {
            display: flex; flex-direction: column; gap: 2px;
            padding: 10px 8px;
        }
        .solstice-nav-item {
            display: block;
            padding: 10px 14px;
            border-radius: var(--flare-shape-full);
            font-size: 14px;
            text-decoration: none;
            color: var(--flare-color-on-surface-variant);
        }
        .solstice-nav-item:hover {
            background: var(--flare-color-surface-container-high);
            color: var(--flare-color-on-surface);
        }
        .solstice-nav-item.active {
            background: var(--flare-color-secondary-container);
            color: var(--flare-color-on-secondary-container);
            font-weight: 500;
        }
        .solstice-nav-foot {
            margin-top: auto;
            padding: 12px 16px 20px;
            font-size: 11px; line-height: 1.7;
            color: var(--flare-color-on-surface-variant);
        }

        /* ---------- 页面 ---------- */
        .solstice-page {
            padding: 24px 28px 64px;
            max-width: 1040px;
        }
        .solstice-head {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 18px;
        }
        .solstice-h1 {
            margin: 0; font-size: 24px; font-weight: 500;
            color: var(--flare-color-on-surface);
        }
        .solstice-muted {
            font-size: 13px; line-height: 1.7;
            color: var(--flare-color-on-surface-variant);
        }
        .solstice-card-title {
            font-size: 15px; font-weight: 500;
            margin-bottom: 12px;
            color: var(--flare-color-on-surface);
        }

        /* ---------- 全屏拖放区 ---------- */
        .solstice-drop {
            position: relative;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10px;
            min-height: calc(100dvh - 64px);
            margin: 0;
            border: 2px dashed var(--flare-color-outline-variant);
            border-radius: var(--flare-shape-extra-large);
            background: var(--flare-color-surface-container-low);
            cursor: pointer;
            transition: border-color .15s ease, background .15s ease;
        }
        .solstice-drop.is-over {
            border-color: var(--flare-color-primary);
            background: var(--flare-color-primary-container);
        }
        .solstice-drop-glyph {
            font-size: 44px; line-height: 1;
            color: var(--flare-color-primary);
        }
        .solstice-drop-title {
            font-size: 20px; font-weight: 500;
            color: var(--flare-color-on-surface);
        }
        .solstice-drop-input {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        /* ---------- 键值表 ---------- */
        .solstice-kv {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 10px 18px;
            font-size: 14px;
            color: var(--flare-color-on-surface);
        }
        .solstice-k {
            font-size: 12px;
            color: var(--flare-color-on-surface-variant);
        }
        .solstice-break { word-break: break-all; }

        /* ---------- 状态 ---------- */
        .solstice-ok {
            font-size: 13px; margin-bottom: 14px;
            color: var(--flare-color-success);
        }
        .solstice-bad {
            font-size: 13px; margin-bottom: 14px;
            color: var(--flare-color-error);
        }
        .solstice-alert-error {
            padding: 12px 16px; margin-bottom: 16px;
            border-radius: var(--flare-shape-medium);
            background: var(--flare-color-error-container);
            color: var(--flare-color-on-error-container);
            font-size: 14px;
        }
        .solstice-chip {
            display: inline-block;
            margin-left: 8px; padding: 2px 10px;
            border-radius: var(--flare-shape-full);
            background: var(--flare-color-success-container);
            color: var(--flare-color-on-success-container);
            font-size: 11px;
        }
        .solstice-note {
            margin-top: 14px;
            font-size: 12px; line-height: 1.7;
            color: var(--flare-color-on-surface-variant);
        }

        /* ---------- 表单 / 预览 ---------- */
        .solstice-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }
        .solstice-preview {
            display: flex; flex-direction: column; gap: 6px;
            margin-top: 16px; padding: 12px 14px;
            border-radius: var(--flare-shape-medium);
            background: var(--flare-color-surface-container-high);
            font-size: 13px;
        }
        .solstice-preview .solstice-k {
            display: inline-block; width: 92px;
        }

        /* ---------- 占位空状态 ---------- */
        .solstice-empty {
            margin-top: 24px; padding: 48px 24px;
            text-align: center;
            border: 2px dashed var(--flare-color-outline-variant);
            border-radius: var(--flare-shape-large);
        }
        .solstice-empty-title {
            font-size: 16px; font-weight: 500; margin-bottom: 8px;
            color: var(--flare-color-on-surface);
        }

        /* ---------- 错误条 ---------- */
        #blazor-error-ui {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            z-index: 100000; padding: 12px 16px;
            background: #ffdad6; color: #410002;
            font-size: 14px;
        }
        #blazor-error-ui .reload { color: #8c1d18; margin-left: 12px; }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>

<body>
    <div id="flare-splash">SOLSTICE</div>
    <div id="app"></div>

    <div id="blazor-error-ui">
        应用出现未处理的错误。
        <a href="." class="reload">重新加载</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/dropzone.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
